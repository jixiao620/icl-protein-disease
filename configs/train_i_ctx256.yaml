data:
  project_root: "/work/jl1401/icl_protein_disease"
  processed_dir: "processed_data_full"

  train_diseases:
    - "I10"
    - "I12"
    - "I120"

  test_diseases:
    - "I11"
    - "I119"
    - "I129"
    - "I15"
    - "I110"
    - "I13"
    - "I151"

model:
  name: "GPT"
  protein_dim: 2941
  hidden_dim: 768
  dropout: 0.2
  temperature: 1.0

training:
  batch_size: 8
  num_epochs: 30
  optimizer: "adam"
  learning_rate: 0.000001
  weight_decay: 0.00001
  lr_scheduler: "cosine"
  warmup_epochs: 5
  loss: "weighted_bce"
  log_interval: 10
  eval_interval: 1
  save_dir: "checkpoints_i_ctx256"
  save_best_only: true
  early_stopping_patience: 15

evaluation:
  metrics:
    - "auroc"
    - "auprc"
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"

context:
  context_size: 256

seed: 42
device: "cuda"
num_workers: 4
