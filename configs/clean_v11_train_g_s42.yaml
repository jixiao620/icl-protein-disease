data:
  project_root: .
  processed_dir: processed_data_clean_ntrain12_g
  selection_path: selection.yaml
  block_letter: G
  train_diseases:
  - G439
  - G43
  - G56
  - G560
  - G47
  - G629
  - G45
  - G473
  - G31
  - G40
  - G55
  - G20
model:
  name: v11_featattn_diseaseemb
  variant: v11_featattn_diseaseemb
  protein_dim: 2941
  hidden_dim: 768
  n_layers: 12
  n_heads: 12
  dropout: 0.2
  dim_feedforward: 3072
  per_prot_hidden: 32
  per_prot_heads: 4
  per_prot_layers: 3
  n_cls_tokens: 4
  n_cls_feat: 24
  n_feat_layers: 1
  feat_heads: 4
training:
  batch_size: 4
  num_epochs: 50
  optimizer: adam
  learning_rate: 1.0e-06
  weight_decay: 1.0e-05
  lr_scheduler: cosine
  warmup_epochs: 5
  loss: weighted_bce
  log_interval: 10
  eval_interval: 1
  save_dir: checkpoints_clean_v11_ntrain12_g_s42
  save_best_only: true
  early_stopping_patience: 15
evaluation:
  metrics:
  - auroc
context:
  context_size: 32
sampling:
  context_pos_ratio: 0.5
  query_pos_ratio: null
seed: 42
device: cuda
num_workers: 4
