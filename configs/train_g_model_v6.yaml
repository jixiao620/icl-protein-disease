data:
  project_root: "/work/jl1401/icl_protein_disease"
  processed_dir: "processed_data_g_v6"

  train_diseases:
    - "G439"
    - "G43"
    - "G56"
    - "G560"
    - "G12"
    - "G45"
    - "G47"
    - "G61"
    - "G93"
    - "G31"

  test_diseases:
    - "G40"
    - "G20"
    - "G30"
    - "G35"

model:
  name: "GPT"
  protein_dim: 2941
  hidden_dim: 768
  dropout: 0.2
  temperature: 1.0

training:
  batch_size: 16
  num_epochs: 25
  optimizer: "adam"
  learning_rate: 0.000001
  weight_decay: 0.00001
  lr_scheduler: "cosine"
  warmup_epochs: 3
  loss: "weighted_bce"
  log_interval: 10
  eval_interval: 1
  crossblock_eval_interval: 3
  save_dir: "checkpoints_g_model_v6"
  save_best_only: true
  early_stopping_patience: 7

context:
  context_size: 32

# v6: no query oversampling (use class weights only for speed)
#     14 training diseases (3.5x more than v4/v5)
#     key additions: G10 Huntington, G41 epilepticus, G61 Guillain-Barre,
#                    G93 brain disorders, G31 degenerative brain
sampling:
  context_pos_ratio: 0.5
  query_pos_ratio: null

seed: 42
device: "cuda"
num_workers: 4
