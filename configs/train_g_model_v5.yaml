data:
  project_root: "/work/jl1401/icl_protein_disease"
  processed_dir: "processed_data_g"

  train_diseases:
    - "G439"
    - "G43"
    - "G56"
    - "G560"

  test_diseases:
    - "G40"
    - "G20"
    - "G30"
    - "G35"

model:
  name: "GPT"
  protein_dim: 2941
  hidden_dim: 768
  dropout: 0.2
  temperature: 1.0

training:
  batch_size: 8
  num_epochs: 30
  optimizer: "adam"
  learning_rate: 0.000001
  weight_decay: 0.00001
  lr_scheduler: "cosine"
  warmup_epochs: 5
  loss: "weighted_bce"
  log_interval: 10
  eval_interval: 1
  save_dir: "checkpoints_g_model_v5"
  save_best_only: true
  early_stopping_patience: 15

evaluation:
  metrics:
    - "auroc"
    - "auprc"
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"

context:
  context_size: 32

# v5: v4 fixes kept (val loss stable, correct class weights on positives only)
#     query_pos_ratio restored: both context and query oversample positives to 50%
sampling:
  context_pos_ratio: 0.5
  query_pos_ratio: 0.5

seed: 42
device: "cuda"
num_workers: 4
