data:
  project_root: "/work/jl1401/icl_protein_disease"
  processed_dir: "processed_data_c_v6"   # reuse v6 preprocessed data

  train_diseases:
    - "C44"
    - "C809"
    - "C50"
    - "C61"
    - "C16"
    - "C22"
    - "C25"
    - "C67"
    - "C71"
    - "C73"
    - "C85"
    - "C90"
    - "C92"
    # C56 held out as proxy val (ovarian cancer, biologically closest to C54 endometrial cancer)

  proxy_val_disease: "C56"   # held-out training disease for checkpoint selection

  test_diseases:
    - "C34"
    - "C18"
    - "C43"
    - "C53"
    - "C54"

model:
  name: "GPT"
  protein_dim: 2941
  hidden_dim: 768
  dropout: 0.2
  temperature: 1.0

training:
  batch_size: 16
  num_epochs: 40
  optimizer: "adam"
  learning_rate: 0.000001
  weight_decay: 0.00001
  lr_scheduler: "cosine"
  warmup_epochs: 3
  loss: "weighted_bce"
  log_interval: 10
  eval_interval: 1
  crossblock_eval_interval: 3   # test disease monitoring only (not used for selection)
  save_dir: "checkpoints_c_model_v7"
  save_best_only: true
  early_stopping_patience: 7

context:
  context_size: 32

# v7 changes vs v6:
#   - proxy_val_disease (C56) replaces in-domain val AUROC for checkpoint selection
#   - 13 train diseases (C56 removed from training, held out as proxy val)
#   - all training data used (no 90/10 split)
#   - epochs=40, patience=7
sampling:
  context_pos_ratio: 0.5
  query_pos_ratio: null

seed: 42
device: "cuda"
num_workers: 4
