data:
  project_root: "/work/jl1401/icl_protein_disease"
  processed_dir: "processed_data_c"

  train_diseases:
    - "C44"
    - "C809"
    - "C50"
    - "C61"

  test_diseases:
    - "C34"
    - "C18"
    - "C43"
    - "C53"
    - "C54"

model:
  name: "GPT"
  protein_dim: 2941
  hidden_dim: 768
  dropout: 0.2
  temperature: 1.0

training:
  batch_size: 8
  num_epochs: 30
  optimizer: "adam"
  learning_rate: 0.000001
  weight_decay: 0.00001
  lr_scheduler: "cosine"
  warmup_epochs: 5
  loss: "weighted_bce"
  log_interval: 10
  eval_interval: 1
  save_dir: "checkpoints_c_model"
  save_best_only: true
  early_stopping_patience: 15

evaluation:
  metrics:
    - "auroc"
    - "auprc"
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"

context:
  context_size: 32

seed: 42
device: "cuda"
num_workers: 4
