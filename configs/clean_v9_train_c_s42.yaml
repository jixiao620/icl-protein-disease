data:
  project_root: .
  processed_dir: processed_data_clean_c
  train_diseases:
  - C44
  - C809
  - C449
  - C50
model:
  name: v9_featattn
  variant: v9_featattn
  protein_dim: 2941
  hidden_dim: 768
  n_layers: 12
  n_heads: 12
  dropout: 0.2
  dim_feedforward: 3072
  per_prot_hidden: 32
  per_prot_heads: 4
  per_prot_layers: 3
  n_cls_tokens: 4
training:
  batch_size: 4
  num_epochs: 50
  optimizer: adam
  learning_rate: 1.0e-06
  weight_decay: 1.0e-05
  lr_scheduler: cosine
  warmup_epochs: 5
  loss: weighted_bce
  log_interval: 10
  eval_interval: 1
  save_dir: checkpoints_clean_v9_c_s42
  save_best_only: true
  early_stopping_patience: 15
evaluation:
  metrics:
  - auroc
context:
  context_size: 32
sampling:
  context_pos_ratio: 0.5
  query_pos_ratio: null
seed: 42
device: cuda
num_workers: 4
