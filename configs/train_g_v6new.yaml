# Line 2 - v6 new architecture - G block
# Same training diseases as v5 for fair comparison.
# ICLTransformerV6: bidirectional, set-based, per-context norm, 3-slot label_emb.

data:
  project_root: "/work/jl1401/icl_protein_disease"
  processed_dir: "processed_data_g"
  train_diseases:
    - "G439"
    - "G43"
    - "G56"
    - "G560"

model:
  name: "v6"
  protein_dim: 2941
  hidden_dim: 768
  n_layers: 12
  n_heads: 12
  dropout: 0.2
  dim_feedforward: 3072

training:
  batch_size: 8
  num_epochs: 30
  optimizer: "adam"
  learning_rate: 0.000001
  weight_decay: 0.00001
  lr_scheduler: "cosine"
  warmup_epochs: 5
  loss: "weighted_bce"
  log_interval: 10
  eval_interval: 1
  save_dir: "checkpoints_g_v6new"
  save_best_only: true
  early_stopping_patience: 15

evaluation:
  metrics:
    - "auroc"

context:
  context_size: 32   # train at K=32; v6 set-based arch allows eval at any K without PE extrapolation

sampling:
  context_pos_ratio: 0.5
  query_pos_ratio: null   # no query oversampling — matches v5's actual behaviour (train_gpt_ctx64 didn't read this key)

seed: 42
device: "cuda"
num_workers: 4
